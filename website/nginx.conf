server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends before nginx, so absolute redirects would say http:// and cost an
    # extra hop through Cloudflare's HTTPS redirect. Send relative Locations.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent pages are prerendered for public agents only. An agent that was
    # removed or is held for review has no page: answer a real 404, not the
    # homepage with a 200, so the URL drops out of search indexes.
    error_page 404 /404.html;

    # /agents/ is only the directory holding agent pages (no index, so nginx
    # answered 403). Agents are browsed on the homepage.
    location ~ ^/agents/?$ {
        return 301 /;
    }

    location /agents/ {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
