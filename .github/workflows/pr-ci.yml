name: PR CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'website/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Disposable Postgres for the tests that need real SQL (tests/conftest.py `db`).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: a2a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a2a_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/a2a_test
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: backend

      - name: Run tests
        run: uv run --extra dev pytest

      - name: Run ruff
        run: uv run --extra dev ruff check app tests

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check nginx routes
        run: ./scripts/check-nginx.sh
