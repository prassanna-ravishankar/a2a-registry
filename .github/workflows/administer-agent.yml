name: Administer Registry Agent

run-name: "${{ inputs.action }}: ${{ inputs.agent_id }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: Registry operation to perform
        required: true
        type: choice
        options:
          - refresh-card
          - clear-maintainer-notes
          - inspect
          - approve
          - reject
          - restore
          - retire
      agent_id:
        description: Agent UUID
        required: true
        type: string
      well_known_uri:
        description: HTTPS Agent Card URL (required for refresh-card)
        required: false
        type: string
      card_sha256:
        description: Fingerprint the decision is about, from inspect (required for approve)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "administer-agent-${{ inputs.agent_id }}"
  cancel-in-progress: false

env:
  API_BASE_URL: https://a2aregistry.org/api
  GKE_CLUSTER: clusterkit
  GKE_REGION: us-central1

jobs:
  administer:
    name: Administer agent
    # Moderation runs only when the repository owner dispatches it.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://a2aregistry.org
    env:
      OPERATOR_ACTION: ${{ inputs.action }}
      AGENT_ID: ${{ inputs.agent_id }}
      WELL_KNOWN_URI: ${{ inputs.well_known_uri }}
      REVIEWED_SHA256: ${{ inputs.card_sha256 }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$AGENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "agent_id must be a UUID" >&2
            exit 1
          fi

          if [[ "$OPERATOR_ACTION" == "refresh-card" ]]; then
            if [[ "$WELL_KNOWN_URI" != https://* ]] || [[ "$WELL_KNOWN_URI" =~ [[:space:]] ]]; then
              echo "refresh-card requires an HTTPS Agent Card URL without whitespace" >&2
              exit 1
            fi
          elif [[ "$OPERATOR_ACTION" == "approve" ]]; then
            if [[ ! "$REVIEWED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "approve requires the card_sha256 printed by inspect" >&2
              exit 1
            fi
          elif [[ "$OPERATOR_ACTION" != "clear-maintainer-notes" && "$OPERATOR_ACTION" != "inspect" && "$OPERATOR_ACTION" != "reject" \
                && "$OPERATOR_ACTION" != "restore" && "$OPERATOR_ACTION" != "retire" ]]; then
            echo "Unsupported action" >&2
            exit 1
          fi

      - name: Load admin credential
        shell: bash
        run: |
          set -euo pipefail
          admin_api_key="$(kubectl get secret a2aregistry-secrets \
            --namespace a2aregistry \
            --output jsonpath='{.data.ADMIN_API_KEY}' | base64 --decode)"
          if [[ -z "$admin_api_key" ]]; then
            echo "ADMIN_API_KEY is missing from the production secret" >&2
            exit 1
          fi
          echo "::add-mask::$admin_api_key"
          echo "ADMIN_API_KEY=$admin_api_key" >> "$GITHUB_ENV"

      - name: Apply operation
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$OPERATOR_ACTION" == "refresh-card" ]]; then
            request_body="$(jq --null-input --arg uri "$WELL_KNOWN_URI" '{wellKnownURI: $uri}')"
            http_status="$(curl --silent --show-error --retry 2 \
              --request PUT \
              --header "Content-Type: application/json" \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --data "$request_body" \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/agents/$AGENT_ID")"
          elif [[ "$OPERATOR_ACTION" == "restore" ]]; then
            # Un-hide only if the card is reachable now; moderation is unchanged.
            http_status="$(curl --silent --show-error \
              --request POST \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/admin/agents/$AGENT_ID/restore")"
          elif [[ "$OPERATOR_ACTION" == "retire" ]]; then
            # Soft delete (hidden), e.g. a listing whose card URL is permanently dead.
            http_status="$(curl --silent --show-error \
              --request DELETE \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/agents/$AGENT_ID")"
          elif [[ "$OPERATOR_ACTION" == "inspect" ]]; then
            # Status and fingerprint only. Nothing about why an agent was
            # flagged is fetched or printed: these logs are public.
            http_status="$(curl --silent --show-error --retry 2 \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/admin/agents/$AGENT_ID/review")"
          elif [[ "$OPERATOR_ACTION" == "approve" || "$OPERATOR_ACTION" == "reject" ]]; then
            # Approval is about specific content, so it binds to the fingerprint
            # the owner inspected and the API refuses it if the card changed.
            # Rejection hides the listing whatever it now says, so it binds to
            # the current fingerprint.
            if [[ "$OPERATOR_ACTION" == "approve" ]]; then
              card_sha256="$REVIEWED_SHA256"
            else
              card_sha256="$(curl --fail --silent --show-error --retry 2 \
                --header "X-Admin-Key: $ADMIN_API_KEY" \
                "$API_BASE_URL/admin/agents/$AGENT_ID/review" | jq --raw-output '.card_sha256 // empty')"
              if [[ -z "$card_sha256" ]]; then
                echo "Agent has no scored fingerprint to decide on" >&2
                exit 1
              fi
            fi
            request_body="$(jq --null-input --arg d "$OPERATOR_ACTION" --arg sha "$card_sha256" \
              '{decision: $d, card_sha256: $sha}')"
            http_status="$(curl --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --data "$request_body" \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/admin/agents/$AGENT_ID/review")"
          else
            http_status="$(curl --silent --show-error --retry 2 \
              --request PATCH \
              --header "Content-Type: application/json" \
              --header "X-Admin-Key: $ADMIN_API_KEY" \
              --data '{"notes": null}' \
              --output "$RUNNER_TEMP/operator-response.json" \
              --write-out '%{http_code}' \
              "$API_BASE_URL/agents/$AGENT_ID/notes")"
          fi

          jq . "$RUNNER_TEMP/operator-response.json"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Registry API returned HTTP $http_status" >&2
            exit 1
          fi

      - name: Verify public record
        if: inputs.action != 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          public_status="$(curl --silent --output "$RUNNER_TEMP/public.json" --write-out '%{http_code}' \
            --retry 2 "$API_BASE_URL/agents/$AGENT_ID")"
          echo "Public record: HTTP $public_status"
          operator_status="$(jq --raw-output '.status // empty' "$RUNNER_TEMP/operator-response.json")"
          case "$OPERATOR_ACTION" in
            reject|retire) expected_status=404 ;;
            restore) if [[ "$(jq --raw-output '.public' "$RUNNER_TEMP/operator-response.json")" == "true" ]]; then expected_status=200; else expected_status=404; fi ;;
            approve) expected_status=200 ;;
            # A held agent stays out of public reads; anything else must be readable.
            *) if [[ "$operator_status" == "under_review" ]]; then expected_status=404; else expected_status=200; fi ;;
          esac
          if [[ "$public_status" != "$expected_status" ]]; then
            echo "Expected public HTTP $expected_status, got $public_status" >&2
            exit 1
          fi
          if [[ "$public_status" == "200" ]]; then
            jq '{id, name, wellKnownURI, maintainer_notes, updated_at}' "$RUNNER_TEMP/public.json"
          fi
